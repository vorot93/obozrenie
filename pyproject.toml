[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "obozrenie"
version = "1"
description = "Simple and easy to use game server browser"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Artem Vorotnikov", email = "artem@vorotnikov.me" }]
license = "GPL-3.0-only"
license-files = ["COPYING"]
dependencies = [
    "xmltodict",
    "maxminddb",
    "pyxdg",
    "tomli-w",
    "requests",
    "urllib3>=2.3",
    "pygobject",
    "pycairo",
    "icmplib>=3.0.4",
    "filelock>=3.32.5",
]

classifiers = [
    "Topic :: Games/Entertainment",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
]

[dependency-groups]
dev = [
    "babel==2.18.0",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/obozrenie/obozrenie"

[project.scripts]
obozrenie-gtk = "obozrenie.launch_gtk:main"

[tool.setuptools]
packages = ["obozrenie", "obozrenie.adapters"]
include-package-data = false

[tool.setuptools.package-data]
obozrenie = [
    "data/applications/*.desktop",
    "data/icons/games/*",
    "data/icons/hicolor/scalable/apps/*.svg",
    "data/locale/*.pot",
    "data/locale/*/LC_MESSAGES/*.po",
    "data/locale/*/LC_MESSAGES/*.mo",
    "data/settings/defaults/*.toml",
    "data/settings/internal/*.toml",
    "data/settings/internal/backends/*.toml",
    "data/ui/*.ui",
]

[tool.setuptools.data-files]
"share/applications" = [
    "obozrenie/data/applications/me.vorotnikov.Obozrenie.desktop",
]
"share/icons/hicolor/scalable/apps" = [
    "obozrenie/data/icons/hicolor/scalable/apps/obozrenie.svg",
    "obozrenie/data/icons/hicolor/scalable/apps/obozrenie-short.svg",
]

[tool.obozrenie.translations]
project = "Obozrenie"
version = "1"
copyright-holder = "Artem Vorotnikov"
copyright-years = "2016-2026"
msgid-bugs-address = "https://github.com/obozrenie/obozrenie/issues"
last-translator = "Artem Vorotnikov <artem@vorotnikov.me>"
template-language-team = "Obozrenie translators <artem@vorotnikov.me>"
russian-language-team = "Russian <artem@vorotnikov.me>"
pot-creation-date = 2026-09-03T15:11:20Z
po-revision-date = 2026-09-02T14:49:55Z
