name: CI

"on":
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GSK_RENDERER: cairo
      GDK_BACKEND: x11
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adwaita-icon-theme gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 gir1.2-gtk-4.0 gcc libadwaita-1-0 libcairo2-dev libgirepository-2.0-dev libgtk-4-1 pkg-config xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install source dependencies
        run: uv sync
      - name: Run source tests and delivery structure checks
        run: xvfb-run -a uv run python -m unittest discover -s tests -p 'test*.py' -v
      - name: Validate translation tooling and catalogs
        run: |
          xvfb-run -a uv run python -m unittest tools.test_translation_tools -v
          uv run python tools/check_translations.py
      - name: Validate Python and GtkBuilder sources
        run: |
          uv run python -m compileall -q obozrenie tests tools
          uv run python -c "import obozrenie.gtk"
      - name: Validate dependency environment
        run: uv pip check
      - name: Build canonical delivery artifacts
        run: uv build --clear --out-dir "${{ runner.temp }}/obozrenie-dist"
      - name: Validate canonical archives and sdist rebuild
        env:
          OBOZRENIE_WHEEL: ${{ runner.temp }}/obozrenie-dist/obozrenie-1-py3-none-any.whl
          OBOZRENIE_SDIST: ${{ runner.temp }}/obozrenie-dist/obozrenie-1.tar.gz
        run: >-
          xvfb-run -a uv run python -m unittest
          tests.test_packaging.ArtifactInputTests
          tests.test_packaging.WheelContractMutationTests
          tests.test_packaging.SdistContractMutationTests
          tests.test_packaging.ArchiveTests -v
      - name: Upload canonical delivery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obozrenie-dist
          path: |
            ${{ runner.temp }}/obozrenie-dist/obozrenie-1-py3-none-any.whl
            ${{ runner.temp }}/obozrenie-dist/obozrenie-1.tar.gz
          if-no-files-found: error

  test:
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OBOZRENIE_TEST_PYTHON: ${{ matrix.python-version }}
      GSK_RENDERER: cairo
      GDK_BACKEND: x11
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adwaita-icon-theme gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 gir1.2-gtk-4.0 gcc libadwaita-1-0 libcairo2-dev libgirepository-2.0-dev libgtk-4-1 pkg-config xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Download canonical delivery artifacts
        uses: actions/download-artifact@v4
        with:
          name: obozrenie-dist
          path: ${{ runner.temp }}/obozrenie-dist
      - name: Test the installed wheel and runtime suite
        env:
          OBOZRENIE_WHEEL: ${{ runner.temp }}/obozrenie-dist/obozrenie-1-py3-none-any.whl
          OBOZRENIE_SDIST: ${{ runner.temp }}/obozrenie-dist/obozrenie-1.tar.gz
        run: >-
          xvfb-run -a python -m unittest
          tests.test_packaging.InstalledArtifactTests.test_wheel_installs_and_smokes_in_a_fresh_selected_python_venv
          -v

  macos:
    if: github.event_name != 'schedule'
    needs: build
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      OBOZRENIE_TEST_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: brew install gtk4 libadwaita gobject-introspection adwaita-icon-theme pkg-config cairo
      - name: Put Homebrew libs on the dynamic loader path
        run: echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Download canonical delivery artifacts
        uses: actions/download-artifact@v4
        with:
          name: obozrenie-dist
          path: ${{ runner.temp }}/obozrenie-dist
      - name: Test the installed wheel, runtime suite, GTK, and resources
        env:
          OBOZRENIE_WHEEL: ${{ runner.temp }}/obozrenie-dist/obozrenie-1-py3-none-any.whl
          OBOZRENIE_SDIST: ${{ runner.temp }}/obozrenie-dist/obozrenie-1.tar.gz
        run: >-
          python -m unittest
          tests.test_packaging.InstalledArtifactTests.test_wheel_installs_and_smokes_in_a_fresh_selected_python_venv
          -v

  custom-prefix:
    if: github.event_name != 'schedule'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OBOZRENIE_TEST_PYTHON: "3.11"
      GSK_RENDERER: cairo
      GDK_BACKEND: x11
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adwaita-icon-theme gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 gir1.2-gtk-4.0 gcc libadwaita-1-0 libcairo2-dev libgirepository-2.0-dev libgtk-4-1 pkg-config xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Download canonical delivery artifacts
        uses: actions/download-artifact@v4
        with:
          name: obozrenie-dist
          path: ${{ runner.temp }}/obozrenie-dist
      - name: Test a clean custom-prefix installation
        env:
          OBOZRENIE_WHEEL: ${{ runner.temp }}/obozrenie-dist/obozrenie-1-py3-none-any.whl
          OBOZRENIE_SDIST: ${{ runner.temp }}/obozrenie-dist/obozrenie-1.tar.gz
        run: >-
          xvfb-run -a python -m unittest
          tests.test_packaging.InstalledArtifactTests.test_wheel_installs_into_a_clean_custom_prefix
          -v

  live-contracts:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adwaita-icon-theme gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 gir1.2-gtk-4.0 gcc libadwaita-1-0 libcairo2-dev libgirepository-2.0-dev libgtk-4-1 pkg-config xvfb
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Install source dependencies
        run: uv sync
      - name: Run deterministic delivery and live-contract tests
        run: xvfb-run -a uv run python -m unittest tests.test_delivery -v
      - name: Run bounded live HTTP contracts
        run: uv run python -m tests.live_contracts
